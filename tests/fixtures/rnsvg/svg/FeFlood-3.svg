<svg xmlns="http://www.w3.org/2000/svg" width="200" height="400">
<filter id="flood" x="0" y="0" width="100%" height="100%" primitiveUnits="objectBoundingBox">
<feFlood x="25%" y="25%" width="50%" height="50%" flood-color="green" flood-opacity="0.75"/>
</filter>
<filter id="merge" primitiveUnits="objectBoundingBox">
<feMerge x="25%" y="25%" width="50%" height="50%"><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<g fill="none" stroke="blue" stroke-width="4">
<rect width="200" height="200"/><line x2="200" y2="200"/><line x1="200" y2="200" x2="0" y1="0"/>
</g>
<circle fill="green" filter="url(#flood)" cx="100" cy="100" r="90"/>
<rect x="55" y="55" width="90" height="90"/>
<g transform="translate(0 200)">
<g fill="none" stroke="blue" stroke-width="4">
<rect width="200" height="200"/><line x2="200" y2="200"/><line x1="200" y2="200"/>
</g>
<circle fill="green" fill-opacity="0.5" filter="url(#merge)" cx="100" cy="100" r="90"/>
</g>
<rect x="55" y="255" width="90" height="90" fill-opacity=".7"/>
</svg>
