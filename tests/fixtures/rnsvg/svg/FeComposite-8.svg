<svg xmlns="http://www.w3.org/2000/svg" width="330" height="195" viewBox="0 0 1100 650">
<defs>
<filter id="overFlood" filterUnits="objectBoundingBox" x="-5%" y="-5%" width="110%" height="110%">
<feFlood flood-color="#ffffff" flood-opacity="1" result="flood" />
<feComposite in="SourceGraphic" in2="BackgroundImage" operator="over" result="comp" />
<feMerge>
<feMergeNode in="flood" />
<feMergeNode in="comp" />
</feMerge>
</filter>
<filter id="inFlood" filterUnits="objectBoundingBox" x="-5%" y="-5%" width="110%" height="110%">
<feFlood flood-color="#ffffff" flood-opacity="1" result="flood" />
<feComposite in="SourceGraphic" in2="BackgroundImage" operator="in" result="comp" />
<feMerge>
<feMergeNode in="flood" />
<feMergeNode in="comp" />
</feMerge>
</filter>
<filter id="outFlood" filterUnits="objectBoundingBox" x="-5%" y="-5%" width="110%" height="110%">
<feFlood flood-color="#ffffff" flood-opacity="1" result="flood" />
<feComposite in="SourceGraphic" in2="BackgroundImage" operator="out" result="comp" />
<feMerge>
<feMergeNode in="flood" />
<feMergeNode in="comp" />
</feMerge>
</filter>
<filter id="atopFlood" filterUnits="objectBoundingBox" x="-5%" y="-5%" width="110%" height="110%">
<feFlood flood-color="#ffffff" flood-opacity="1" result="flood" />
<feComposite in="SourceGraphic" in2="BackgroundImage" operator="atop" result="comp" />
<feMerge>
<feMergeNode in="flood" />
<feMergeNode in="comp" />
</feMerge>
</filter>
<filter id="xorFlood" filterUnits="objectBoundingBox" x="-5%" y="-5%" width="110%" height="110%">
<feFlood flood-color="#ffffff" flood-opacity="1" result="flood" />
<feComposite in="SourceGraphic" in2="BackgroundImage" operator="xor" result="comp" />
<feMerge>
<feMergeNode in="flood" />
<feMergeNode in="comp" />
</feMerge>
</filter>
<filter id="arithmeticFlood" filterUnits="objectBoundingBox" x="-5%" y="-5%" width="110%" height="110%">
<feFlood flood-color="#ffffff" flood-opacity="1" result="flood" />
<feComposite in="SourceGraphic" in2="BackgroundImage" result="comp" operator="arithmetic" k1=".5" k2=".5" k3=".5" k4=".5" />
<feMerge>
<feMergeNode in="flood" />
<feMergeNode in="comp" />
</feMerge>
</filter>
<filter id="overNoFlood" filterUnits="objectBoundingBox" x="-5%" y="-5%" width="110%" height="110%">
<feComposite in="SourceGraphic" in2="BackgroundImage" operator="over" result="comp" />
</filter>
<filter id="inNoFlood" filterUnits="objectBoundingBox" x="-5%" y="-5%" width="110%" height="110%">
<feComposite in="SourceGraphic" in2="BackgroundImage" operator="in" result="comp" />
</filter>
<filter id="outNoFlood" filterUnits="objectBoundingBox" x="-5%" y="-5%" width="110%" height="110%">
<feComposite in="SourceGraphic" in2="BackgroundImage" operator="out" result="comp" />
</filter>
<filter id="atopNoFlood" filterUnits="objectBoundingBox" x="-5%" y="-5%" width="110%" height="110%">
<feComposite in="SourceGraphic" in2="BackgroundImage" operator="atop" result="comp" />
</filter>
<filter id="xorNoFlood" filterUnits="objectBoundingBox" x="-5%" y="-5%" width="110%" height="110%">
<feComposite in="SourceGraphic" in2="BackgroundImage" operator="xor" result="comp" />
</filter>
<filter id="arithmeticNoFlood" filterUnits="objectBoundingBox" x="-5%" y="-5%" width="110%" height="110%">
<feComposite in="SourceGraphic" in2="BackgroundImage" result="comp" operator="arithmetic" k1=".5" k2=".5" k3=".5" k4=".5" />
</filter>
<path id="Blue100" d="M 0 0 L 100 0 L 100 100 z" fill="#00ffff" />
<path id="Red100" d="M 0 0 L 0 100 L 100 0 z" fill="#ff00ff" />
<path id="Blue50" d="M 0 125 L 100 125 L 100 225 z" fill="#00ffff" fill-opacity=".5" />
<path id="Red50" d="M 0 125 L 0 225 L 100 125 z" fill="#ff00ff" fill-opacity=".5" />
<g id="TwoBlueTriangles">
<use href="#Blue100" />
<use href="#Blue50" />
</g>
<g id="BlueTriangles">
<use transform="translate(275,25)" href="#TwoBlueTriangles" />
<use transform="translate(400,25)" href="#TwoBlueTriangles" />
<use transform="translate(525,25)" href="#TwoBlueTriangles" />
<use transform="translate(650,25)" href="#TwoBlueTriangles" />
<use transform="translate(775,25)" href="#TwoBlueTriangles" />
<use transform="translate(900,25)" href="#TwoBlueTriangles" />
</g>
</defs>
<rect fill="none" stroke="blue" x="1" y="1" width="1098" height="648" />
<g font-family="DejaVu Sans" font-size="40" shape-rendering="crispEdges">
<g enable-background="new">
<text x="15" y="75"> opacity 1.0 </text>
<text x="15" y="115" font-size="27"> (with FeFlood) </text>
<text x="15" y="200"> opacity 0.5 </text>
<text x="15" y="240" font-size="27"> (with FeFlood) </text>
<use href="#BlueTriangles" />
<g transform="translate(275,25)">
<use href="#Red100" filter="url(#overFlood)" />
<use href="#Red50" filter="url(#overFlood)" />
<text x="5" y="275"> over </text>
</g>
<g transform="translate(400,25)">
<use href="#Red100" filter="url(#inFlood)" />
<use href="#Red50" filter="url(#inFlood)" />
<text x="35" y="275"> in </text>
</g>
<g transform="translate(525,25)">
<use href="#Red100" filter="url(#outFlood)" />
<use href="#Red50" filter="url(#outFlood)" />
<text x="15" y="275"> out </text>
</g>
<g transform="translate(650,25)">
<use href="#Red100" filter="url(#atopFlood)" />
<use href="#Red50" filter="url(#atopFlood)" />
<text x="10" y="275"> atop </text>
</g>
<g transform="translate(775,25)">
<use href="#Red100" filter="url(#xorFlood)" />
<use href="#Red50" filter="url(#xorFlood)" />
<text x="15" y="275"> xor </text>
</g>
<g transform="translate(900,25)">
<use href="#Red100" filter="url(#arithmeticFlood)" />
<use href="#Red50" filter="url(#arithmeticFlood)" />
<text x="-25" y="275"> arithmetic </text>
</g>
</g>
<g transform="translate(0,325)" enable-background="new">
<text x="15" y="75"> opacity 1.0 </text>
<text x="15" y="115" font-size="27"> (without FeFlood) </text>
<text x="15" y="200"> opacity 0.5 </text>
<text x="15" y="240" font-size="27"> (without FeFlood) </text>
<use href="#BlueTriangles" />
<g transform="translate(275,25)">
<use href="#Red100" filter="url(#overNoFlood)" />
<use href="#Red50" filter="url(#overNoFlood)" />
<text x="5" y="275"> over </text>
</g>
<g transform="translate(400,25)">
<use href="#Red100" filter="url(#inNoFlood)" />
<use href="#Red50" filter="url(#inNoFlood)" />
<text x="35" y="275"> in </text>
</g>
<g transform="translate(525,25)">
<use href="#Red100" filter="url(#outNoFlood)" />
<use href="#Red50" filter="url(#outNoFlood)" />
<text x="15" y="275"> out </text>
</g>
<g transform="translate(650,25)">
<use href="#Red100" filter="url(#atopNoFlood)" />
<use href="#Red50" filter="url(#atopNoFlood)" />
<text x="10" y="275"> atop </text>
</g>
<g transform="translate(775,25)">
<use href="#Red100" filter="url(#xorNoFlood)" />
<use href="#Red50" filter="url(#xorNoFlood)" />
<text x="15" y="275"> xor </text>
</g>
<g transform="translate(900,25)">
<use href="#Red100" filter="url(#arithmeticNoFlood)" />
<use href="#Red50" filter="url(#arithmeticNoFlood)" />
<text x="-25" y="275"> arithmetic </text>
</g>
</g>
</g>
</svg>
