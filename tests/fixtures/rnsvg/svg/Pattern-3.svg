<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
<defs>
<pattern id="stripe" patternUnits="userSpaceOnUse" patternContentUnits="userSpaceOnUse" width="8" height="12" patternTransform="rotate(45)">
<rect width="4" height="8" fill="white" x="0" y="0"/>
<rect width="4" height="12" fill="black" x="4" y="0"/>
</pattern>
</defs>
<g transform="matrix(1 0 0 -1 0 140)">
<rect x="0" y="0" width="100" height="100" fill="url(#stripe)"/>
</g>
</svg>
