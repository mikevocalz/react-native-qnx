<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100">
<g transform="rotate(50 40 30)" id="group">
<line x1="60" y1="10" x2="140" y2="10" stroke="#060" stroke-width="1"/>
<rect x="60" y="20" height="50" width="80" stroke="#060" stroke-width="1" fill="#060"/>
<text x="100" y="75" stroke="#600" stroke-width="1" fill="#600" text-anchor="middle" font-family="DejaVu Sans">Text grouped with shapes</text>
</g>
<use href="#group" transform="translate(5 40) rotate(-50) scale(0.75)" stroke="red" opacity="0.5"/>
</svg>
