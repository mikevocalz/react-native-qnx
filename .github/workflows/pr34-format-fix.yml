name: PR34 TypeScript/Prettier one-shot repair

on:
  push:
    branches: [feat/marathon-metro-platform-20261102]
    paths:
      - .github/workflows/pr34-format-fix.yml

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.repository == 'mikevocalz/react-native-qnx'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/marathon-metro-platform-20261102
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - name: Apply installed repository Prettier
        run: pnpm exec prettier --write tests/js/marathon-metro-platform.test.mjs
      - name: Verify format and type-safe source contracts
        run: |
          pnpm format:check
          pnpm test:js
          pnpm typecheck
      - name: Commit only formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/js/marathon-metro-platform.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(marathon): format typed Metro platform test"
          git push origin HEAD:feat/marathon-metro-platform-20261102
