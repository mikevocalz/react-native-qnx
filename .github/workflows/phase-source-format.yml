name: Phase source diagnostics

on:
  pull_request:
    branches: [feat/qnx-integrated-dx-candidate]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - name: Capture formatter output without editing source
        run: |
          mkdir -p /tmp/phase-format
          for file in packages/expo-qnx-autolinking/src/index.js packages/expo-qnx-autolinking/src/index.d.ts packages/expo-qnx-autolinking/bin/expo-qnx-autolinking.js tests/js/expo-dual-platform.test.mjs tests/js/expo-dual-discovery.test.mjs docs/getting-started/expo-dual-autolinking.md; do
            mkdir -p "/tmp/phase-format/$(dirname "$file")"
            pnpm exec prettier "$file" > "/tmp/phase-format/$file"
          done
      - name: Run real discovery and CMake integration
        run: |
          node tests/js/expo-dual-platform.test.mjs
          node tests/js/expo-dual-discovery.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-format-${{ github.event.pull_request.head.sha }}
          path: /tmp/phase-format/
          retention-days: 1
