name: Phase source diagnostics

on:
  pull_request:
    branches: [feat/qnx-integrated-dx-candidate]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - name: Capture formatter output without editing source
        run: |
          mkdir -p /tmp/phase-format
          for file in packages/react-native-qnx/Libraries/ReactNative/PublicAPI.js packages/metro-config-qnx/public-entry.js packages/metro-config-qnx/public-entry.d.ts apps/rn-playground/public-api-probe.js apps/rn-playground/metro.public.config.js apps/rn-playground/metro.public.marathon.config.js tests/js/qnx-public-entry.test.mjs tests/js/qnx-public-entry-metro.test.mjs docs/getting-started/public-react-native-entry.md; do
            mkdir -p "/tmp/phase-format/$(dirname "$file")"
            pnpm exec prettier "$file" > "/tmp/phase-format/$file"
          done
      - name: Real public-import bundles
        run: |
          node tests/js/qnx-public-entry.test.mjs
          node tests/js/qnx-public-entry-metro.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-format-${{ github.event.pull_request.head.sha }}
          path: /tmp/phase-format/
          retention-days: 1
