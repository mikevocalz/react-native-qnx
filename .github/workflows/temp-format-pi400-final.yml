name: Temporary exact formatter for Pi400 final test
on:
  push:
    branches: [test/pi400-final-physical-qualification]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test/pi400-final-physical-qualification
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - name: Format only new Pi 400 test files
        run: |
          pnpm exec prettier --write scripts/final-pi400-test.mjs tests/js/pi400-final-physical.test.mjs docs/validation/pi400-final-test.md
          git diff --check
          if ! git diff --quiet -- scripts/final-pi400-test.mjs tests/js/pi400-final-physical.test.mjs docs/validation/pi400-final-test.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/final-pi400-test.mjs tests/js/pi400-final-physical.test.mjs docs/validation/pi400-final-test.md
            git commit -m "style(pi400): apply pinned Prettier formatting"
            git push origin HEAD:test/pi400-final-physical-qualification
          fi
