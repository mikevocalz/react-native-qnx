name: One-shot update security lockfile for SDK 58

on:
  push:
    branches:
      - chore/sdk58-stable-pins-20261102
    paths:
      - pnpm-workspace.yaml
      - .github/workflows/pr36-security-lockfile.yml

permissions:
  contents: write

concurrency:
  group: pr36-security-lockfile
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.repository == 'mikevocalz/react-native-qnx'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/sdk58-stable-pins-20261102
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - name: Install exact pnpm
        run: npm install --global pnpm@12.8.1
      - name: Regenerate the *real* lockfile from registry
        run: pnpm install --lockfile-only
      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile
      - name: Run dependency and compatibility checks
        run: |
          node scripts/validate-security-overrides.mjs
          pnpm validate:dependencies
          pnpm typecheck
          pnpm test:js
          pnpm audit:dependencies
      - name: Commit only genuine regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(deps): lock verified November 2026 security patches"
          git push origin HEAD:chore/sdk58-stable-pins-20261102
