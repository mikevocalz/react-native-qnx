name: One-shot branch formatting

on:
  push:
    branches:
      - chore/pi-hardware-ready-2026-10-02

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/pi-hardware-ready-2026-10-02
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Remove one-shot workflow and commit formatting
        run: |
          rm .github/workflows/one-shot-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply repository formatting"
          git push origin HEAD:chore/pi-hardware-ready-2026-10-02
