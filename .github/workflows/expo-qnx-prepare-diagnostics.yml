name: Expo QNX preparation diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/expo-qnx/**'
      - 'tests/js/expo-qnx-*.test.mjs'
      - '.github/workflows/expo-qnx-prepare-diagnostics.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - name: Capture formatter output without modifying source
        run: |
          for source in packages/expo-qnx/src/cli.mjs packages/expo-qnx/README.md tests/js/expo-qnx-prepare.test.mjs tests/js/expo-qnx-discovery.test.mjs; do
            mkdir -p "build/format-diagnostics/$(dirname "$source")"
            pnpm exec prettier "$source" > "build/format-diagnostics/$source"
          done
      - name: Check actual preparation and discovery
        run: |
          pnpm typecheck
          node tests/js/expo-qnx-prepare.test.mjs
          node tests/js/expo-qnx-discovery.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expo-qnx-format-${{ github.event.pull_request.head.sha }}
          path: build/format-diagnostics/
          retention-days: 1
          if-no-files-found: error
