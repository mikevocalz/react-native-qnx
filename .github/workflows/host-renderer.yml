name: SDK 58 full host renderer

on:
  pull_request:
    branches: [main, feat/qnx-integrated-dx-candidate, feat/qnx-phases-1-7-integration]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer:
    name: Qt 6.11 / RN 0.88 / Hermes (input lifecycle ${{ matrix.input-lifecycle }})
    strategy:
      fail-fast: false
      matrix:
        input-lifecycle: ['OFF', 'ON']
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QSG_RHI_BACKEND: software
      # Qt Multimedia warns on stderr when PipeWire is missing; the consumer test parses stderr as JSON.
      QT_LOGGING_RULES: qt.multimedia.symbolsresolver=false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libclang-dev libicu-dev
          python3 -m pip install --user --break-system-packages cmake==3.31.10
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install exact host Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.11.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true
      - name: Verify reproducible SVG bindings
        if: matrix.input-lifecycle == 'ON'
        run: |
          pnpm qt:svg:check
          pnpm qt:rnsvg:check
          pnpm qt:native-ui:check
          pnpm qt:video:check
      - name: Build and run the required full renderer graph
        run: |
          mkdir -p build/linux-host-renderer/evidence
          git rev-parse HEAD > build/linux-host-renderer/evidence/commit.txt
          cmake --preset linux-host-renderer \
            -DRNQNX_ENABLE_INPUT_LIFECYCLE=${{ matrix.input-lifecycle }} \
            -DRNQNX_ENABLE_TEXT_INPUT_CONTRACT=${{ matrix.input-lifecycle }} \
            -DRNQNX_ENABLE_ACCESSIBILITY_BRIDGE=${{ matrix.input-lifecycle }} \
            -DRNQNX_ENABLE_WINDOW_CHROME=${{ matrix.input-lifecycle }} \
            -DRNQNX_ENABLE_QT_SVG=${{ matrix.input-lifecycle }} \
            -DRNQNX_ENABLE_QT_RNSVG=${{ matrix.input-lifecycle }} \
            -DRNQNX_ENABLE_QT_NATIVE_UI=${{ matrix.input-lifecycle }} \
            -DRNQNX_ENABLE_QT_EXPO_IMAGE=${{ matrix.input-lifecycle }} \
            -DRNQNX_ENABLE_WORKLETS=${{ matrix.input-lifecycle }} \
            -DRNQNX_ENABLE_REANIMATED=${{ matrix.input-lifecycle }} \
            -DRNQNX_ENABLE_GESTURE_HANDLER=${{ matrix.input-lifecycle }} \
            -DRNQNX_ENABLE_QT_MOTION=${{ matrix.input-lifecycle }} \
            -DRNQNX_ENABLE_QT_GRAPHICS=${{ matrix.input-lifecycle }} \
            -DRNQNX_ENABLE_QT_VIDEO=${{ matrix.input-lifecycle }}
          node scripts/validate-host-renderer.mjs
      - name: Worklet queue and frame shutdown under ASan and UBSan (ON leg)
        if: matrix.input-lifecycle == 'ON'
        run: |
          cmake -S tests/native/worklets -B build/worklets-lifecycle -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DRNQNX_WORKLETS_SANITIZERS=ON
          cmake --build build/worklets-lifecycle --parallel 2
          ctest --test-dir build/worklets-lifecycle --output-on-failure
      - name: Render the conformance app (Linux host only)
        run: |
          set -euo pipefail
          evidence=build/linux-host-renderer/evidence
          pnpm qnx bundle-qnx --app component-conformance --out build/component-conformance.bundle.js
          timeout 30s build/linux-host-renderer/bin/rnqnx_playground_host \
            --bundle "$PWD/build/component-conformance.bundle.js" \
            --screenshot "$PWD/$evidence/conformance.png" \
            2>&1 | tee "$evidence/conformance-render.log"
          grep -F 'RNQNX_PLAYGROUND_SCREENSHOT' "$evidence/conformance-render.log"
          test -s "$evidence/conformance.png"
          sha256sum build/component-conformance.bundle.js "$evidence/conformance.png" > "$evidence/conformance-sha256.txt"
      - name: Render both window chrome layouts (Linux host only, chrome ON leg)
        if: matrix.input-lifecycle == 'ON'
        run: |
          set -euo pipefail
          evidence=build/linux-host-renderer/evidence
          for controls in macos windows; do
            timeout 30s build/linux-host-renderer/bin/rnqnx_playground_host \
              --bundle "$PWD/build/component-conformance.bundle.js" \
              --window-controls "$controls" --window-size 700x500 \
              --screenshot "$PWD/$evidence/chrome-$controls.png" \
              2>&1 | tee "$evidence/chrome-$controls.log"
            grep -F "RNQNX_WINDOW_CHROME platform=offscreen controls=$controls style=default inset=44 window=700x500" "$evidence/chrome-$controls.log"
            grep -F 'RNQNX_WINDOW_CHROME platform=offscreen hidden=minimize' "$evidence/chrome-$controls.log"
            grep -F 'RNQNX_PLAYGROUND_SCREENSHOT' "$evidence/chrome-$controls.log"
          done
          if build/linux-host-renderer/bin/rnqnx_playground_host --bundle "$PWD/build/component-conformance.bundle.js" --window-controls gnome > "$evidence/chrome-invalid.log" 2>&1; then
            echo "invalid --window-controls was accepted"; exit 1
          fi
          grep -F 'RNQNX_WINDOW_CONFIG_ERROR' "$evidence/chrome-invalid.log"
          sha256sum "$evidence"/chrome-*.png > "$evidence/chrome-sha256.txt"
      - name: Render performance workloads (Linux host only)
        run: |
          set -euo pipefail
          evidence="$PWD/build/linux-host-renderer/evidence"
          for workload in hello-world list-1000; do
            entry=index.js
            if [ "$workload" = hello-world ]; then entry=hello-world.js; fi
            (
              cd apps/performance-lab
              timeout 90s ../../node_modules/.bin/metro build "$entry" --config metro.config.js --platform qnx --dev false --max-workers 2 --out "$evidence/$workload.bundle.js"
            )
            timeout 30s build/linux-host-renderer/bin/rnqnx_playground_host --bundle "$evidence/$workload.bundle.js" --screenshot "$evidence/$workload.png" 2>&1 | tee "$evidence/$workload-render.log"
            test -s "$evidence/$workload.png"
            sha256sum "$evidence/$workload.bundle.js" "$evidence/$workload.png" > "$evidence/$workload.sha256"
          done
      - name: Create and render an app from a fresh source checkout
        run: pnpm validate:clean-app --renderer "$PWD/build/linux-host-renderer/bin/rnqnx_playground_host"
      - name: Exercise one external public-import app through both target tools
        run: |
          RNQNX_CONSUMER_BUILD="$PWD/build/linux-host-renderer" \
          RNQNX_INTEGRATED_RENDERER="$PWD/build/linux-host-renderer/bin/rnqnx_playground_host" \
          RNQNX_INTEGRATED_EVIDENCE="$PWD/build/linux-host-renderer/evidence/external-app" \
          node tests/js/qnx-integrated-consumer.test.mjs
      - name: Preserve exact-run test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-renderer-${{ github.event.pull_request.head.sha || github.sha }}-input-${{ matrix.input-lifecycle }}
          path: |
            build/linux-host-renderer/evidence/
            build/linux-host-renderer/Testing/Temporary/
            build/linux-host-renderer/CMakeCache.txt
            build/linux-host-renderer/CMakeFiles/CMakeConfigureLog.yaml
            build/worklets-lifecycle/Testing/Temporary/
            build/clean-app-evidence.*/
          if-no-files-found: warn
