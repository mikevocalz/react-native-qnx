name: PR36 one-shot Prettier and native source verification

on:
  push:
    branches: [chore/sdk58-stable-pins-20261102]
    paths:
      - .github/workflows/pr36-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'mikevocalz/react-native-qnx'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/sdk58-stable-pins-20261102
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatter
        run: |
          pnpm exec prettier --write scripts/validate-dependencies.mjs docs/dependencies/SDK58_STABLE_UPGRADE.md
          pnpm format:check
      - name: Commit only reviewed formatted paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-dependencies.mjs docs/dependencies/SDK58_STABLE_UPGRADE.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(deps): normalize SDK58 source contracts and migration evidence"
          git push origin HEAD:chore/sdk58-stable-pins-20261102
      - name: Run exact source and JS tests
        run: |
          pnpm validate:dependencies
          pnpm test:js
          pnpm typecheck
