name: Pi tooling quality

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/scripts/**'
      - 'docs/getting-started/**'
      - 'package.json'
      - '.github/workflows/pi-tooling-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'tests/scripts/**'
      - 'docs/getting-started/**'
      - 'package.json'
      - '.github/workflows/pi-tooling-quality.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  shell:
    name: Shell syntax and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck cmake build-essential

      - name: Use pinned Node for tooling regressions
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: Bash syntax
        run: |
          bash -n \
            scripts/doctor.sh \
            scripts/lib/qnx-target.sh \
            scripts/pi-preflight.sh \
            scripts/install-pi.sh \
            scripts/pi-mouse-smoke.sh \
            scripts/lib/qnx-wait.sh \
            scripts/lib/wait-log.sh \
            scripts/validate-runtime-qnx.sh \
            scripts/deploy-qnx.sh \
            scripts/run-qnx.sh \
            scripts/log-qnx.sh \
            scripts/qnx-sdk-container.sh \
            scripts/validate-qnx-vm.sh \
            tools/qnx-winmgr/swap-winmgr.sh

      - name: Qt distribution clean-tree regression
        run: |
          bash -n scripts/qt-public/assert-clean-tree.sh tests/scripts/qt-public-clean-tree.test.sh
          bash tests/scripts/qt-public-clean-tree.test.sh

      - name: Qt QNX plugin patch-selection regression
        run: |
          bash -n scripts/qt-public/qnx-patch-set.sh scripts/qt-public/apply-qnx-patches.sh scripts/qt-public/make-source-bundle.sh tests/scripts/qt-public-patch-selection.test.sh
          bash tests/scripts/qt-public-patch-selection.test.sh
          python3 -I tests/python/test_qt_public_source_bundle.py
          python3 -I tests/python/test_qt_build_guard.py
          python3 -I tests/python/test_qt_package_manifest.py
          python3 -I tests/python/test_qt_closure_runpath.py

      - name: Qt cached-toolchain and attempt-log regressions
        run: |
          cmake --version
          cc --version
          node tests/js/qnx-pr217-regressions.test.mjs

      - name: ShellCheck
        run: |
          shellcheck -x \
            scripts/doctor.sh \
            scripts/lib/qnx-target.sh \
            scripts/lib/qnx-wait.sh \
            scripts/lib/wait-log.sh \
            scripts/pi-preflight.sh \
            scripts/install-pi.sh \
            scripts/pi-mouse-smoke.sh \
            scripts/deploy-qnx.sh \
            scripts/run-qnx.sh \
            scripts/log-qnx.sh \
            scripts/qnx-sdk-container.sh \
            scripts/validate-qnx-vm.sh \
            tools/qnx-winmgr/swap-winmgr.sh
