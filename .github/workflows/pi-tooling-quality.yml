name: Pi tooling quality

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'docs/getting-started/**'
      - 'package.json'
      - '.github/workflows/pi-tooling-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'docs/getting-started/**'
      - 'package.json'
      - '.github/workflows/pi-tooling-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell syntax and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: |
          bash -n \
            scripts/doctor.sh \
            scripts/lib/qnx-target.sh \
            scripts/pi-preflight.sh \
            scripts/install-pi.sh \
            scripts/validate-runtime-qnx.sh \
            scripts/deploy-qnx.sh \
            scripts/run-qnx.sh \
            scripts/log-qnx.sh \
            scripts/qnx-sdk-container.sh

      - name: ShellCheck
        run: |
          shellcheck \
            scripts/doctor.sh \
            scripts/lib/qnx-target.sh \
            scripts/pi-preflight.sh \
            scripts/install-pi.sh \
            scripts/deploy-qnx.sh \
            scripts/run-qnx.sh \
            scripts/log-qnx.sh \
            scripts/qnx-sdk-container.sh
