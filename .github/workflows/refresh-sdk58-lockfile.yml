name: Refresh SDK 58 lockfile

on:
  push:
    branches:
      - feat/pi-qsti-ready-2026-10-01
    paths:
      - package.json
      - apps/**/package.json
      - packages/**/package.json
      - pnpm-workspace.yaml
      - .github/workflows/refresh-sdk58-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/pi-qsti-ready-2026-10-01

      - name: Use current Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.10.0

      - name: Install pnpm
        run: npm install --global pnpm@12.8.1

      - name: Resolve current SDK 58 graph
        run: pnpm install --no-frozen-lockfile

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): refresh pnpm lockfile for Expo SDK 58"
          git push origin HEAD:feat/pi-qsti-ready-2026-10-01

      - name: Validate manifests
        run: pnpm validate:manifests

      - name: Validate dependency and source contracts
        run: pnpm validate:dependencies

      - name: Typecheck
        run: pnpm typecheck

      - name: JavaScript tests
        run: pnpm test:js
