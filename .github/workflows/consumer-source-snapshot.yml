name: Consumer source snapshot
on:
  push:
    branches: [feat/qnx-consumer-native-app-identity]
    paths: [.github/workflows/consumer-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Capture tracked source and pinned guidance only
        run: |
          set -euo pipefail
          mkdir -p snapshot/guidance
          git archive --format=tar.gz HEAD > snapshot/source.tar.gz
          git rev-parse HEAD > snapshot/commit.txt
          git rev-parse HEAD^{tree} > snapshot/tree.txt
          for skill in api-design build-nitro-modules cpp; do
            curl --fail --silent --show-error --max-time 30 "https://raw.githubusercontent.com/margelo/react-native-skills/1e9e17be6f41c838db472d6a4b943fc26355a3be/skills/$skill/SKILL.md" > "snapshot/guidance/$skill.md"
          done
          for skill in create-react-native-library github-actions writing-user-docs; do
            curl --fail --silent --show-error --max-time 30 "https://raw.githubusercontent.com/callstackincubator/agent-skills/59e9d17446a248b21d86f078fcd0bd2d36db1ca4/skills/$skill/SKILL.md" > "snapshot/guidance/$skill.md"
          done
          cd snapshot
          sha256sum source.tar.gz guidance/*.md > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: consumer-source-${{ github.sha }}
          path: snapshot/
          retention-days: 1
          if-no-files-found: error
