name: One-shot formatting for Nitro dual platform library

on:
  push:
    branches:
      - feat/nitro-v1-marathon-native-host-20261102
    paths:
      - .github/workflows/pr41-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'mikevocalz/react-native-qnx'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/nitro-v1-marathon-native-host-20261102
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - name: Format exactly the new Nitro native contract docs and tests
        run: |
          pnpm exec prettier --write docs/nitro/NATIVE_DUAL_TARGETS.md
          pnpm exec prettier --write tests/js/nitro-dual-host-contract.test.mjs
          pnpm exec prettier --write scripts/validate-qnx-nitro.mjs
          pnpm exec prettier --write tests/js/nitro-v1-native-migration.test.mjs
          pnpm format:check
      - name: Verify regenerated bindings and platform source contracts
        run: |
          pnpm nitro:platform:check
          pnpm test:js
          pnpm validate:qnx-nitro
          pnpm typecheck
      - name: Commit only reviewed formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nitro/NATIVE_DUAL_TARGETS.md
          git add tests/js/nitro-dual-host-contract.test.mjs
          git add scripts/validate-qnx-nitro.mjs
          git add tests/js/nitro-v1-native-migration.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(nitro): align dual-platform native proof with Prettier"
          git push origin HEAD:feat/nitro-v1-marathon-native-host-20261102
