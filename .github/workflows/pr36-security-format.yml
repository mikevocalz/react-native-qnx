name: One-shot formatting for security audit files

on:
  push:
    branches:
      - chore/sdk58-stable-pins-20261102
    paths:
      - .github/workflows/pr36-security-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'mikevocalz/react-native-qnx'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/sdk58-stable-pins-20261102
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - name: Apply exact repository formatter
        run: |
          pnpm exec prettier --write             docs/security/NOVEMBER_2026_NPM_REMEDIATION.md             scripts/validate-security-overrides.mjs
          pnpm format:check
      - name: Commit only formatted security files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/security/NOVEMBER_2026_NPM_REMEDIATION.md scripts/validate-security-overrides.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(security): apply Prettier to audited dependency guidance"
          git push origin HEAD:chore/sdk58-stable-pins-20261102
