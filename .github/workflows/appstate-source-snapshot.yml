name: Installed AppState contract snapshot
on:
  push:
    branches: [feat/qnx-appstate-runtime-integration]
    paths: [.github/workflows/appstate-source-snapshot.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - name: Record installed public framework contracts
        run: |
          set -euo pipefail
          mkdir -p snapshot
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { readFileSync, mkdirSync, copyFileSync } from 'node:fs';
          import path from 'node:path';
          const require = createRequire(path.resolve('package.json'));
          const root = path.dirname(require.resolve('react-native/package.json'));
          const files = ['package.json', 'Libraries/AppState/AppState.js', 'Libraries/AppState/NativeAppState.js', 'src/private/specs_DEPRECATED/modules/NativeAppState.js', 'Libraries/EventEmitter/NativeEventEmitter.js', 'ReactCommon/react/nativemodule/core/ReactCommon/TurboModule.h', 'ReactCommon/react/nativemodule/core/ReactCommon/TurboModule.cpp'];
          for (const file of files) {
            const output = path.join('snapshot', file);
            mkdirSync(path.dirname(output), {recursive:true});
            copyFileSync(path.join(root, file), output);
          }
          NODE
          git rev-parse HEAD > snapshot/commit.txt
          find snapshot -type f -print0 | sort -z | xargs -0 sha256sum > snapshot/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: installed-appstate-contract-${{ github.sha }}
          path: snapshot/
          retention-days: 1
          if-no-files-found: error
