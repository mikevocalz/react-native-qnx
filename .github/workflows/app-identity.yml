name: Native application identity
on:
  pull_request:
    paths:
      - 'vnext/include/react-native-qnx/runtime/ApplicationIdentity.h'
      - 'vnext/include/react-native-qnx/runtime/ApplicationIcon.h'
      - 'native/app-identity/**'
      - 'packages/react-native-qnx-cli/src/app-identity.mjs'
      - 'tests/js/app-identity.test.mjs'
      - '.github/workflows/app-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sanitizers: ['OFF', 'ON']
    env:
      QT_QPA_PLATFORM: offscreen
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxcb-cursor0
          python3 -m pip install --user --break-system-packages cmake==3.31.10
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.11.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
      - name: Compile and run real identity contract
        run: |
          set -euo pipefail
          mkdir -p build/app-identity-evidence
          git rev-parse HEAD > build/app-identity-evidence/commit.txt
          cmake -S native/app-identity -B build/app-identity-off -G Ninja
          cmake --build build/app-identity-off
          cmake -S native/app-identity -B build/app-identity -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DRNQNX_BUILD_APP_IDENTITY_TESTS=ON -DRNQNX_APP_IDENTITY_SANITIZERS=${{ matrix.sanitizers }} -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/app-identity -j 2
          ctest --test-dir build/app-identity --output-on-failure -V 2>&1 | tee build/app-identity-evidence/tests.txt
          "$PWD/build/app-identity/rnqnx_identity_tool" label --text-hex "$(printf 'Calculator' | xxd -p)" \
            --font native/app-identity/fonts/source-sans-3/SourceSans3-Regular.ttf \
            --font native/app-identity/fonts/source-sans-3/SourceSans3-Light.ttf \
            --pixel-size 20 --box-width 92.4 | tee build/app-identity-evidence/label-calculator.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - name: CLI icon and label checks against the real tool
        run: |
          set -euo pipefail
          RNQNX_IDENTITY_TOOL="$PWD/build/app-identity/rnqnx_identity_tool" node tests/js/app-identity.test.mjs 2>&1 | tee build/app-identity-evidence/cli.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: app-identity-${{ matrix.sanitizers }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/app-identity-evidence/
