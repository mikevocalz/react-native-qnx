name: Marathon development tooling validation
on:
  pull_request:
    paths:
      - 'packages/qnx-devtools/src/marathon.mjs'
      - 'packages/react-native-qnx-cli/src/bin.mjs'
      - 'tests/js/marathon-development-launcher.test.mjs'
      - '.github/workflows/phase5-tooling.yml'
      - 'docs/getting-started/marathon-development-launcher.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marathon-development-tooling-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - name: Validate formatting and actual process tests
        run: |
          pnpm format:check
          pnpm typecheck
          pnpm validate:dependencies
          pnpm test:js
