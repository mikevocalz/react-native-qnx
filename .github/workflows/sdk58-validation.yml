name: SDK 58 validation

on:
  push:
    branches:
      - main
      - ci/sdk58-validation
  pull_request:
    branches:
      - main
      - feat/qnx-integrated-dx-candidate
      - feat/qnx-phases-1-7-integration
      - feat/qnx-consumer-native-app-identity
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk58-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Use Node 26
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@12.18.0

      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify security override contract
        run: node scripts/validate-security-overrides.mjs

      - name: Format
        run: pnpm format:check

      - name: Validate manifests and dependency contracts
        run: |
          pnpm validate:manifests
          pnpm validate:dependencies
          pnpm typecheck
          pnpm peers check

      - name: Expo SDK 58 package support list matches installed expo
        run: pnpm validate:expo-sdk58-support

      - name: Bundle playground for QNX
        run: |
          cd apps/rn-playground
          ../../node_modules/.bin/metro build index.js --platform qnx --dev false --out /tmp/rnqnx-playground.bundle.js
          test -s /tmp/rnqnx-playground.bundle.js
          du -h /tmp/rnqnx-playground.bundle.js

      - name: Bundle non-premium QNX conformance fixture
        run: |
          pnpm qnx bundle-qnx --app component-conformance --out build/component-conformance.bundle.js
          test -s build/component-conformance.bundle.js
          sha256sum build/component-conformance.bundle.js

      - name: Validate repository structure and codegen state
        run: |
          pnpm test:js
          pnpm build:packages
          pnpm validate:architecture
          pnpm codegen:check

      - name: Exercise a fresh source checkout
        run: pnpm validate:clean-app

      - name: Install repository CMake floor
        run: |
          python3 -m pip install --user --break-system-packages cmake==3.31.10
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Linux host C++ smoke tests
        run: |
          cmake --version
          pnpm test:cpp:host

      - name: Security audit
        run: pnpm audit:dependencies

      - name: Preserve fresh-checkout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clean-app-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/clean-app-evidence.*/
          if-no-files-found: warn
