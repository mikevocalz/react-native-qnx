name: React Fabric Qt QNX source check

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/RnqnxReactQt.cmake'
      - 'cmake/RnqnxReactProbe.cmake'
      - 'apps/rn-playground/react-probe.js'
      - 'tests/cmake/ReactRenderProbeNegative.cmake'
      - 'tests/cmake/ReactRenderProbePositive.cmake'
      - 'cmake/dependencies/HermesQNX.cmake'
      - 'cmake/dependencies/ReactNativeRenderer.cmake'
      - 'vnext/probes/react-qnx/**'
      - 'scripts/validate-react-qnx-source.mjs'
      - '.github/workflows/react-qnx-source-check.yml'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - 'CMakeLists.txt'
      - 'cmake/RnqnxReactQt.cmake'
      - 'cmake/RnqnxReactProbe.cmake'
      - 'apps/rn-playground/react-probe.js'
      - 'tests/cmake/ReactRenderProbeNegative.cmake'
      - 'tests/cmake/ReactRenderProbePositive.cmake'
      - 'cmake/dependencies/HermesQNX.cmake'
      - 'cmake/dependencies/ReactNativeRenderer.cmake'
      - 'vnext/probes/react-qnx/**'
      - 'scripts/validate-react-qnx-source.mjs'
      - '.github/workflows/react-qnx-source-check.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:qnx-react
      - run: pnpm format:check
      - name: Build real React probe bundle (source lane only)
        run: |
          cd apps/rn-playground
          ../../node_modules/.bin/metro build react-probe.js --platform qnx --dev false --out /tmp/rnqnx-react-probe.bundle.js
          test -s /tmp/rnqnx-react-probe.bundle.js
