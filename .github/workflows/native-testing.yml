name: Native testing
on:
  pull_request:
    paths:
      - 'native/testing/**'
      - 'docs/nitro/API_CONTRACTS.md'
      - '.github/workflows/native-testing.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-testing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-query:
    name: Node query (host, Qt 6.11.1, sanitizers ${{ matrix.sanitizers }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sanitizers: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxcb-cursor0
          python3 -m pip install --user --break-system-packages cmake==3.31.10
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.11.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
      - name: Compile and run the node query tests
        run: |
          set -euo pipefail
          mkdir -p build/native-testing-evidence
          git rev-parse HEAD > build/native-testing-evidence/commit.txt
          cmake -S native/testing -B build/native-testing -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DRNQNX_BUILD_NATIVE_TESTING_TESTS=ON -DRNQNX_NATIVE_TESTING_SANITIZERS=${{ matrix.sanitizers }} -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native-testing -j 2
          ctest --test-dir build/native-testing --output-on-failure -V 2>&1 | tee build/native-testing-evidence/tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-testing-${{ matrix.sanitizers }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/native-testing-evidence/
