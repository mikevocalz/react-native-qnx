name: Expo QNX autolinking

on:
  pull_request:
    paths:
      - 'packages/expo-qnx-autolinking/**'
      - 'packages/expo-qnx-config-plugins/**'
      - 'scripts/validate-qnx-expo-autolinking.mjs'
      - 'tests/js/expo-qnx-autolinking.test.mjs'
      - '.github/workflows/expo-qnx-autolinking.yml'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - 'packages/expo-qnx-autolinking/**'
      - 'packages/expo-qnx-config-plugins/**'
      - 'scripts/validate-qnx-expo-autolinking.mjs'
      - 'tests/js/expo-qnx-autolinking.test.mjs'
      - '.github/workflows/expo-qnx-autolinking.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:qnx-expo-autolinking
      - run: pnpm test:js
      - run: pnpm format:check
