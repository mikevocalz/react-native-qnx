name: Documentation site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/component-support.json'
      - 'docs/releases/**'
      - 'docs/adr/**'
      - 'CHANGELOG.md'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Project Pages serves the site under /<repo>. DOCS_SITE_URL is the origin only.
  DOCS_BASE_PATH: /react-native-qnx
  DOCS_SITE_URL: https://mikevocalz.github.io

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # generate-data.mjs reads `git log` for each evidence file.
          fetch-depth: 0

      - name: Use Node 26
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generated pages are current
        run: npm run data:check

      - name: Build static site
        run: npm run build

      - name: Check links, front matter and build output
        run: npm run check:content

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
