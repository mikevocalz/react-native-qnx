name: PR36 exact lockfile regeneration (temporary)

on:
  push:
    branches: [chore/sdk58-stable-pins-20261102]
    paths:
      - .github/workflows/pr36-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'mikevocalz/react-native-qnx'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR36 branch
        uses: actions/checkout@v5
        with:
          ref: chore/sdk58-stable-pins-20261102
          persist-credentials: true

      - name: Node matching SDK58 CI
        uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@12.8.1

      - name: Regenerate from registry, never hand-edit lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Verify frozen installation of generated graph
        run: pnpm install --frozen-lockfile

      - name: Check lockfile consistency and explicit source contracts
        run: |
          git diff --check
          pnpm validate:dependencies
          pnpm test:js

      - name: Commit only generated pnpm lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "chore(lock): regenerate exact SDK58/RN0.88 pnpm lockfile"
          git push origin HEAD:chore/sdk58-stable-pins-20261102

      - name: Retain generated lockfile and package graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr36-generated-pnpm-lockfile
          path: |
            pnpm-lock.yaml
            package.json
          if-no-files-found: error
