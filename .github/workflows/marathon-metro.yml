name: Marathon Metro platform conformance

on:
  pull_request:
    paths:
      - 'packages/metro-config-marathon/**'
      - 'packages/react-native-marathon/**'
      - 'packages/metro-config-qnx/**'
      - 'packages/react-native-qnx/**'
      - 'packages/qnx-devtools/src/marathon.mjs'
      - 'apps/rn-playground/**'
      - 'tests/js/marathon-*.test.mjs'
      - 'scripts/validate-dependencies.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/marathon-metro.yml'
  push:
    branches: [main]
    paths:
      - 'packages/metro-config-marathon/**'
      - 'packages/react-native-marathon/**'
      - 'packages/metro-config-qnx/**'
      - 'packages/react-native-qnx/**'
      - 'packages/qnx-devtools/src/marathon.mjs'
      - 'apps/rn-playground/**'
      - 'tests/js/marathon-*.test.mjs'
      - 'scripts/validate-dependencies.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/marathon-metro.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metro:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - run: npm install --global pnpm@12.21.0
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: Source contracts
        run: |
          pnpm format:check
          pnpm test:js
          pnpm typecheck
          pnpm validate:dependencies
      - name: Production QNX and Marathon bundles
        run: |
          mkdir -p build/marathon-metro-evidence
          cd apps/rn-playground
          ../../node_modules/.bin/metro build index.js --platform qnx --dev false --out ../../build/marathon-metro-evidence/playground.qnx.js
          ../../node_modules/.bin/metro build index.js --config metro.marathon.config.js --platform marathon --dev false --out ../../build/marathon-metro-evidence/playground.marathon.js
          test -s ../../build/marathon-metro-evidence/playground.qnx.js
          test -s ../../build/marathon-metro-evidence/playground.marathon.js
      - name: Development Marathon bundle
        run: |
          cd apps/rn-playground
          ../../node_modules/.bin/metro build index.js --config metro.marathon.config.js --platform marathon --dev true --out ../../build/marathon-metro-evidence/playground.marathon.dev.js
          test -s ../../build/marathon-metro-evidence/playground.marathon.dev.js
      - name: QNX bundle isolation and checksums
        run: |
          cd build/marathon-metro-evidence
          marker='Marathon native host must install __RNQNX_PLATFORM_CONSTANTS'
          if grep -q -F "$marker" playground.qnx.js; then
            echo "::error::QNX bundle contains a Marathon-only module"
            exit 1
          fi
          grep -q -F "$marker" playground.marathon.js || {
            echo "::error::Marathon bundle does not contain the Marathon Platform module"
            exit 1
          }
          qnx_sum=$(sha256sum playground.qnx.js | cut -d' ' -f1)
          marathon_sum=$(sha256sum playground.marathon.js | cut -d' ' -f1)
          if [ "$qnx_sum" = "$marathon_sum" ]; then
            echo "::error::Marathon bundle is identical to the QNX bundle"
            exit 1
          fi
          sha256sum playground.*.js | tee SHA256SUMS
          git rev-parse HEAD > commit.txt
      - name: Archive exact branch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marathon-metro-${{ github.sha }}
          path: build/marathon-metro-evidence/
          if-no-files-found: warn
