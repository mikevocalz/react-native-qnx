name: Format combined Pi doc
# Temporary branch-only formatter; removed after it writes the file.

on:
  push:
    branches:
      - ci/sdk58-validation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci/sdk58-validation
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - name: Format Pi runbook
        run: pnpm exec prettier --write docs/getting-started/raspberry-pi-today.md
      - name: Commit formatted runbook
        run: |
          if git diff --quiet -- docs/getting-started/raspberry-pi-today.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/getting-started/raspberry-pi-today.md
          git commit -m "chore(format): normalize Raspberry Pi runbook"
          git push origin HEAD:ci/sdk58-validation
