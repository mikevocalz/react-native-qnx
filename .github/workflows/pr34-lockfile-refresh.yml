name: PR34 Marathon Metro workspace lockfile regeneration (temporary)

on:
  push:
    branches: [feat/marathon-metro-platform-20261102]
    paths:
      - .github/workflows/pr34-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'mikevocalz/react-native-qnx'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/marathon-metro-platform-20261102
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - name: Generate and frozen-install workspaces
        run: |
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm install --frozen-lockfile
      - name: Verify Marathon and existing QNX JS source tests
        run: |
          git diff --check
          pnpm test:js
          pnpm typecheck
          cd apps/rn-playground
          ../../node_modules/.bin/metro build index.js --config metro.marathon.config.js --platform marathon --dev false --out /tmp/pr34-marathon.bundle.js
          test -s /tmp/pr34-marathon.bundle.js
      - name: Commit generated lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "chore(lock): add Marathon Metro package workspace importers"
          git push origin HEAD:feat/marathon-metro-platform-20261102
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr34-marathon-metro-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
