name: Temporary exact formatter for native consumer build
on:
  push:
    branches: [feat/qnx-consumer-native-build-cli]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/qnx-consumer-native-build-cli
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - name: Format new code and test under exact locked formatter
        run: |
          pnpm exec prettier --write packages/react-native-qnx-cli/src/build-native.mjs tests/js/qnx-native-consumer-build.test.mjs
          git diff --check
          if ! git diff --quiet -- packages/react-native-qnx-cli/src/build-native.mjs tests/js/qnx-native-consumer-build.test.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/react-native-qnx-cli/src/build-native.mjs tests/js/qnx-native-consumer-build.test.mjs
            git commit -m "style(native-build): apply pinned Prettier"
            git push origin HEAD:feat/qnx-consumer-native-build-cli
          fi
