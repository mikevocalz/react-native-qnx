name: JS thread under ThreadSanitizer (host)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: js-thread-tsan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsan:
    name: ThreadSanitizer, JS-thread host test (host, Linux, Qt 6.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QSG_RHI_BACKEND: software
      # Qt Multimedia warns on stderr when PipeWire is missing; the consumer test parses stderr as JSON.
      QT_LOGGING_RULES: qt.multimedia.symbolsresolver=false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - run: npm install --global pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libclang-dev libicu-dev
          python3 -m pip install --user --break-system-packages cmake==3.31.10
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install exact host Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.11.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true
      - name: Build and run the JS-thread host test under ThreadSanitizer
        run: |
          set -euo pipefail
          mkdir -p build/js-thread-tsan/evidence
          git rev-parse HEAD > build/js-thread-tsan/evidence/commit.txt
          cmake -S . -B build/js-thread-tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            "-DCMAKE_C_FLAGS=-fsanitize=thread -fno-omit-frame-pointer" \
            "-DCMAKE_CXX_FLAGS=-fsanitize=thread -fno-omit-frame-pointer" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread" \
            -DRNQNX_REQUIRE_FULL_HOST_RENDERER=ON -DRNQNX_BUILD_HERMES=ON \
            -DRNQNX_FETCH_REACT_NATIVE_DEPS=ON -DRNQNX_ENABLE_HOST_SANITIZERS=OFF \
            -DRNQNX_ENABLE_WINDOW_CHROME=ON
          cmake --build build/js-thread-tsan --target qt_react_host_js_thread_host_test --parallel 2
          TSAN_OPTIONS=halt_on_error=0 build/js-thread-tsan/bin/qt_react_host_js_thread_host_test \
            -platform offscreen 2>&1 | tee build/js-thread-tsan/evidence/run.txt
          ! grep -q 'WARNING: ThreadSanitizer' build/js-thread-tsan/evidence/run.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: js-thread-tsan-${{ github.sha }}
          path: build/js-thread-tsan/evidence/
