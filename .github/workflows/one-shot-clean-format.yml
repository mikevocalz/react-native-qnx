name: One-shot clean branch formatter

on:
  push:
    branches:
      - chore/rn088-cxx-dependency-contract-clean

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/rn088-cxx-dependency-contract-clean
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-dependencies.mjs
          git commit -m "style: format dependency contract validator"
          git push origin HEAD:chore/rn088-cxx-dependency-contract-clean
