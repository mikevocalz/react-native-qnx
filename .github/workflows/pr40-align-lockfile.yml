name: One-shot Nitro typed codegen lockfile alignment

on:
  push:
    branches:
      - feat/nitro-v1-typed-platform-bindings-20261102
    paths:
      - .github/workflows/pr40-align-lockfile.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'mikevocalz/react-native-qnx'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/nitro-v1-typed-platform-bindings-20261102
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --lockfile-only
      - run: pnpm install --frozen-lockfile
      - name: Verify native v1 spec generation, source and security
        run: |
          pnpm format:check
          pnpm validate:dependencies
          pnpm validate:qnx-nitro
          pnpm nitro:platform:check
          pnpm codegen:check
          pnpm test:js
          pnpm typecheck
          pnpm audit:dependencies
      - name: Commit only genuinely generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(nitro): align TypeScript6 codegen lockfile with audited v1 core"
          git push origin HEAD:feat/nitro-v1-typed-platform-bindings-20261102
