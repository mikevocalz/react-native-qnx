name: Nitro QNX source check

on:
  pull_request:
    paths:
      - 'packages/qnx-nitro-runtime/**'
      - 'scripts/validate-qnx-nitro.mjs'
      - '.github/workflows/nitro-qnx-source-check.yml'
      - 'package.json'
      - 'vnext/probes/runtime-qnx/**'
      - 'scripts/validate-runtime-qnx.sh'
      - 'CMakeLists.txt'
  push:
    branches:
      - main
    paths:
      - 'packages/qnx-nitro-runtime/**'
      - 'scripts/validate-qnx-nitro.mjs'
      - '.github/workflows/nitro-qnx-source-check.yml'
      - 'package.json'
      - 'vnext/probes/runtime-qnx/**'
      - 'scripts/validate-runtime-qnx.sh'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:qnx-nitro
      - run: pnpm format:check
