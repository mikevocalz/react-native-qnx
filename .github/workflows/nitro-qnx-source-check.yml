name: Nitro QNX source check

on:
  pull_request:
    paths:
      - 'packages/qnx-nitro-runtime/**'
      - 'scripts/validate-qnx-nitro.mjs'
      - '.github/workflows/nitro-qnx-source-check.yml'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - 'packages/qnx-nitro-runtime/**'
      - 'scripts/validate-qnx-nitro.mjs'
      - '.github/workflows/nitro-qnx-source-check.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:qnx-nitro
      - run: pnpm format:check
