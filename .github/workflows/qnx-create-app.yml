name: External Expo project creation
on:
  pull_request:
    paths:
      - 'packages/react-native-qnx-cli/src/**'
      - 'tests/js/qnx-project-create.test.mjs'
      - 'docs/getting-started/expo-project-create.md'
      - '.github/workflows/qnx-create-app.yml'
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - name: Validate source and dependencies
        run: |
          pnpm format:check
          pnpm typecheck
          pnpm validate:dependencies
          pnpm validate:manifests
      - name: Exercise source-distributed CLI and real local packages
        run: |
          node tests/js/qnx-project-create.test.mjs
          pnpm test:js
      - name: Native prerequisites for the icon and label tool
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev
          python3 -m pip install --user --break-system-packages cmake==3.31.10
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
      - name: Build the icon and label tool
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          cmake -S native/app-identity -B build/identity-tool -G Ninja -DRNQNX_BUILD_IDENTITY_TOOL=ON
          cmake --build build/identity-tool
          echo "RNQNX_IDENTITY_TOOL=$PWD/build/identity-tool/rnqnx_identity_tool" >> "$GITHUB_ENV"
      - name: Build one externally generated Expo app for both JS targets
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/rnqnx-created-dual"
          node packages/react-native-qnx-cli/src/bin.mjs project create --project "$app" --app-id org.example.created --name Created --with-marathon
          cd "$app"
          pnpm install
          pnpm run bundle:qnx
          pnpm run bundle:marathon
          test -s build/qnx/app.bundle.js
          test -s build/marathon/app.bundle.js
          node "$GITHUB_WORKSPACE/packages/react-native-qnx-cli/src/bin.mjs" project prepare-native --project "$app" --platform qnx
          node "$GITHUB_WORKSPACE/packages/react-native-qnx-cli/src/bin.mjs" project prepare-native --project "$app" --platform marathon
          test -s build/qnx/native-app.json
          test -s build/marathon/native-app.json
          test -s build/marathon/icons/icon-512.png
          node -e 'const d=require("./build/marathon/native-app.json"); if (d.labelFit.status !== "measured" || d.shortName !== "Created") process.exit(1)'
          sha256sum build/qnx/app.bundle.js build/marathon/app.bundle.js
      - name: Validate architecture, codegen and dependency integrity
        run: |
          pnpm validate:architecture
          pnpm codegen:check
          pnpm audit:dependencies
