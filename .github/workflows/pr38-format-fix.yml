name: PR38 Nitro source-contract formatter (temporary)

on:
  push:
    branches: [feat/nitro-v1-native-qnx-20261102]
    paths:
      - .github/workflows/pr38-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'mikevocalz/react-native-qnx'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/nitro-v1-native-qnx-20261102
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global pnpm@12.8.1
      - run: pnpm install --frozen-lockfile
      - name: Format only Nitro v1 source and docs
        run: |
          pnpm exec prettier --write docs/dependencies/NITRO_V1_MIGRATION.md docs/nitro/API_CONTRACTS.md docs/nitro/SKILLS_AND_ROSTER.md scripts/validate-qnx-nitro.mjs docs/dependencies/SDK58_STABLE_UPGRADE.md scripts/validate-dependencies.mjs
          pnpm format:check
      - name: Commit formatted files (no force push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dependencies/NITRO_V1_MIGRATION.md docs/nitro/API_CONTRACTS.md docs/nitro/SKILLS_AND_ROSTER.md scripts/validate-qnx-nitro.mjs docs/dependencies/SDK58_STABLE_UPGRADE.md scripts/validate-dependencies.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(nitro): format v1 migration docs and source verifier"
          git push origin HEAD:feat/nitro-v1-native-qnx-20261102
      - name: Verify real source/test contract
        run: |
          pnpm validate:qnx-nitro
          pnpm test:js
          pnpm typecheck
