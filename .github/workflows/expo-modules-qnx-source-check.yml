name: Expo Modules QNX source check

on:
  pull_request:
    paths:
      - 'packages/expo-modules-core-qnx/**'
      - 'scripts/validate-qnx-expo-modules.mjs'
      - '.github/workflows/expo-modules-qnx-source-check.yml'
      - 'package.json'
      - 'vnext/probes/runtime-qnx/**'
      - 'scripts/validate-runtime-qnx.sh'
      - 'CMakeLists.txt'
  push:
    branches:
      - main
    paths:
      - 'packages/expo-modules-core-qnx/**'
      - 'scripts/validate-qnx-expo-modules.mjs'
      - '.github/workflows/expo-modules-qnx-source-check.yml'
      - 'package.json'
      - 'vnext/probes/runtime-qnx/**'
      - 'scripts/validate-runtime-qnx.sh'
      - 'CMakeLists.txt'

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:qnx-expo-modules
      - run: pnpm format:check
